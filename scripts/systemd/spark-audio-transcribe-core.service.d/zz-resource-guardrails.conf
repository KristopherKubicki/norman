[Unit]
# Avoid a crash/restart loop that keeps the node under memory and I/O pressure.
StartLimitIntervalSec=15min
StartLimitBurst=3

[Service]
# Distil-large-v3 has measured below this envelope. A hard cgroup boundary is
# preferable to host-wide swap exhaustion or a manual power cycle.
MemoryHigh=12G
MemoryMax=16G
MemorySwapMax=0
TasksMax=512
LimitNOFILE=65536
OOMPolicy=stop
Restart=on-failure
RestartSec=30s
TimeoutStopSec=90s

NoNewPrivileges=true
PrivateTmp=true
ProtectControlGroups=true
ProtectKernelModules=true
ProtectKernelTunables=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictSUIDSGID=true
LockPersonality=true
