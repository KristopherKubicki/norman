[Unit]
# A repeatedly failing gateway must stop instead of consuming the node in a
# restart loop.
StartLimitIntervalSec=5min
StartLimitBurst=3

[Service]
# The gateway accepts only one bounded ASR upload at a time. Keep a runaway
# parser or upstream retry from exhausting the Spark host.
MemoryHigh=3G
MemoryMax=4G
MemorySwapMax=0
TasksMax=256
LimitNOFILE=65536
OOMPolicy=stop
Restart=on-failure
RestartSec=15s
TimeoutStopSec=30s

NoNewPrivileges=true
PrivateTmp=true
ProtectControlGroups=true
ProtectKernelModules=true
ProtectKernelTunables=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictSUIDSGID=true
LockPersonality=true
